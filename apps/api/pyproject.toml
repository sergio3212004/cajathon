[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Monge", email = "smonge630@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "sqlmodel>=0.0.50",
]

[project.scripts]
api = "api:main"

[tool.fastapi]
entrypoint = "api.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
