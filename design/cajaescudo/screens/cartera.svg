, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC200"><tspan x="34" dy="0">RIE-01 · Riesgos</tspan></text><text x="34" y="774" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="34" dy="0">Inclusión financiera y</tspan><tspan x="34" dy="17.759999999999998">resiliencia</tspan></text><text x="34" y="824" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#F6DDE1"><tspan x="34" dy="0">Owner: Miriam</tspan></text><text x="24" y="1008" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">Entorno demostrativo</tspan></text><text x="24" y="1030" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="24" dy="0">Sin datos personales reales</tspan></text><rect x="230" y="0" width="1210" height="76" rx="0" fill="#FFFFFF"/><rect x="230" y="0" width="1210" height="3" rx="0" fill="#FF0901"/><text x="266" y="32" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#596775"><tspan x="266" dy="0">Caja Trujillo / Inteligencia climática y crediticia</tspan></text><text x="266" y="53" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="266" dy="0">Corte ilustrativo: 25 nov 2026 · Acceso interno</tspan></text><rect x="1120" y="23" width="144" height="27" rx="6" fill="#FFF5D6"/><text x="1130" y="41" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="1130" dy="0">Datos sintéticos</tspan></text><text x="1290" y="43" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="1290" dy="0">Miriam · Riesgos</tspan></text><text x="266" y="124" font-family="Manrope, Arial, sans-serif" font-size="29" font-weight="800" fill="#202C39"><tspan x="266" dy="0">Estrés climático de cartera</tspan></text><text x="266" y="153" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#596775"><tspan x="266" dy="0">Distingue exposición, daño al negocio y pérdida crediticia.</tspan></text><text x="266" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="266" dy="0">CajaEscudo · RIE-01     /     Diseño demostrativo; no ejecuta modelos ni decisiones crediticias.</tspan></text><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><text x="1280" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#A51D24"><tspan x="1280" dy="0">Ver metodología</tspan></text></a><rect x="266" y="182" width="1138" height="48" rx="8" fill="#FFF5D6"/><text x="280" y="202" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="500" fill="#805600"><tspan x="280" dy="0">Ejercicio ilustrativo. No constituye estimación regulatoria, provisión contable ni pronóstico calibrado.</tspan></text><rect x="266" y="248" width="271" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="282" y="273" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="600" fill="#596775"><tspan x="282" dy="0">Saldo expuesto (EAD)</tspan></text><text x="282" y="312" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="282" dy="0">S/ 7.68 M</tspan></text><text x="282" y="339" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="282" dy="0">No representa pérdida</tspan></text><rect x="555" y="248" width="271" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="571" y="273" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="600" fill="#596775"><tspan x="571" dy="0">Pérdida crediticia de estrés</tspan></text><text x="571" y="312" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#A51D24"><tspan x="571" dy="0">S/ 422 mil</tspan></text><text x="571" y="339" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="571" dy="0">PD × LGD × EAD · supuestos</tspan></text><rect x="844" y="248" width="271" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="860" y="273" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="600" fill="#596775"><tspan x="860" dy="0">Rango ilustrativo de pérdida</tspan></text><text x="860" y="312" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="860" dy="0">S/ 230–610 mil</tspan></text><text x="860" y="339" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="860" dy="0">Rango de ejemplo, no calibrado</tspan></text><rect x="1133" y="248" width="271" height="110" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="1149" y="273" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="600" fill="#596775"><tspan x="1149" dy="0">Incremento frente a base</tspan></text><text x="1149" y="312" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#805600"><tspan x="1149" dy="0">S/ 249 mil</tspan></text><text x="1149" y="339" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="1149" dy="0">Base: S/ 173 mil</tspan></text><rect x="266" y="380" width="716" height="328" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="412" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">La exposición no es la pérdida</tspan></text><text x="286" y="438" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">Mismo saldo expuesto; distinta afectación según el escenario.</tspan></text><text x="286" y="479" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="286" dy="0">Base · PD 5.0%</tspan></text><text x="824" y="479" fo