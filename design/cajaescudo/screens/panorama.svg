<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="Panorama de riesgo"><title>Panorama de riesgo</title><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F4F7FA"/><rect x="0" y="0" width="230" height="1080" rx="0" fill="#801D2B"/><path d="M43 34 59 41v13c0 9-7 16-16 20-9-4-16-11-16-20V41Z" fill="none" stroke="#FFC200" stroke-width="2.5"/><path d="m35 52 6 6 11-12" fill="none" stroke="#FFC200" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="49" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF"><tspan x="72" dy="0">CajaEscudo</tspan></text><text x="72" y="68" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="72" dy="0">Anticipar para proteger</tspan></text><text x="26" y="116" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF"><tspan x="26" dy="0">Caja Trujillo</tspan></text><path d="M26 138H204" stroke="#A6505C" stroke-width="1"/><a href="#panorama" aria-label="Abrir panorama" style="cursor:pointer"><rect x="16" y="166" width="198" height="53" rx="8" fill="#A13B47"/><text x="28" y="196" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFC200"><tspan x="28" dy="0">01</tspan></text><text x="57" y="189" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="57" dy="0">Panorama territorial</tspan></text></a><a href="#cliente" aria-label="Abrir cliente" style="cursor:pointer"><rect x="16" y="231" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="261" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">02</tspan></text><text x="57" y="254" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Vulnerabilidad del</tspan><tspan x="57" dy="17.759999