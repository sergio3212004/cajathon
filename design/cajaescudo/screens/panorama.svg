nt-weight="400" fill="#596775"><tspan x="266" dy="0">Prioriza dónde actuar, no a quién excluir.</tspan></text><text x="266" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="266" dy="0">CajaEscudo · RIE-01     /     Diseño demostrativo; no ejecuta modelos ni decisiones crediticias.</tspan></text><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><text x="1280" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#A51D24"><tspan x="1280" dy="0">Ver metodología</tspan></text></a><rect x="266" y="181" width="1138" height="62" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="284" y="202" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="284" dy="0">Amenaza</tspan></text><text x="284" y="224" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="284" dy="0">Lluvias e inundación</tspan></text><text x="555" y="202" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="555" dy="0">Territorio</tspan></text><text x="555" y="224" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="555" dy="0">La Libertad</tspan></text><text x="770" y="202" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="770" dy="0">Horizonte</tspan></text><text x="770" y="224" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="770" dy="0">30 días</tspan></text><text x="944" y="202" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="944" dy="0">Intensidad</tspan></text><text x="944" y="224" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="944" dy="0">Severa</tspan></text><rect x="1207" y="199" width="173" height="27"