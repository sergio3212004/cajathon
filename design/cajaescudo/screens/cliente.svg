rial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="382" dy="0">Mayor sensibilidad al ingreso de agua.</tspan></text><rect x="286" y="647" width="80" height="27" rx="6" fill="#FFF5D6"/><text x="296" y="665" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="296" dy="0">Expone</tspan></text><text x="382" y="665" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="382" dy="0">Liquidez para 4 días</tspan></text><text x="382" y="686" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="382" dy="0">Reserva menor al rango de interrupción.</tspan></text><rect x="286" y="712" width="80" height="27" rx="6" fill="#FFF5D6"/><text x="296" y="730" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="296" dy="0">Expone</tspan></text><text x="382" y="730" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="382" dy="0">Una sola ruta de abastecimiento</tspan></text><text x="382" y="751" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="382" dy="0">Dependencia de continuidad del transporte.</tspan></text><rect x="286" y="777" width="80" height="27" rx="6" fill="#EAF5EF"/><text x="296" y="795" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#17634C"><tspan x="296" dy="0">Protege</tspan></text><text x="382" y="795" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="382" dy="0">Pagos al día</tspan></text><text x="382" y="816" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="382" dy="0">Resiliencia crediticia; no elimina la exposición.</tspan></text><rect x="844" y="540" width="560" height="335" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="864" y="572" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="864" dy="0">El flujo puede ser insuficiente</tspan></text><text x="864" y="600" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#202C39"><tspan x="864" dy="0">64% de las trayectorias ilustrativas presentan flujo disponible menor</tspan><tspan x="864" dy="19.24">a las obligaciones del mes.</tspan></text><rect x="864" y="647" width="340" height="27" rx="6" fill="#FFF5D6"/><text x="874" y="665" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="874" dy="0">No es probabilidad de incumplimiento</tspan></text><text x="864" y="709" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="864" dy="0">Flujo base</tspan></text><text x="1220" y="709" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="1220" dy="0">S/ 2,000</tspan></text><rect x="864" y="720" width="470" height="9" rx="4" fill="#225A86"/><text x="864" y="758" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="864" dy="0">Obligaciones</tspan></text><text x="1220" y="758" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="1220" dy="0">S/ 1,410</tspan></text><rect x="864" y="769" width="331" height="9" rx="4" fill="#596775"/><text x="864" y="807" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="864" dy="0">Flujo bajo estrés</tspan></text><text x="1220" y="807" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="1220" dy="0">S/ 1,170</tspan></text><rect x="864" y="818" width="275" height="9" rx="4" fill="#A51D24"/><rect x="266" y="895" width="1138" height="48" rx="8" fill="#EDF4FA"/><text x="280" y="915" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="500" fill="#225A86"><tspan x="280" dy="0">Recomendación: verificar inventario, liquidez y rutas. Acordar medidas con el cliente; no inferir mora por su ubicación.</tspan></text><rect x="266" y="960" width="1138" height="65" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="284" y="983" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="284" dy="0">Trazabilidad: corte mensual 25 nov 2026 · Escenario sintético · Ubicación aproximada · Versión conceptual CE-0.1</tspan></text><text x="284" y="1006" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="284" dy="0">Datos faltantes: seguro y reserva alternativa · Calidad limitada · Validación con el asesor requerida.</tspan></text></svg>