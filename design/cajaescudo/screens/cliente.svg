serif" font-size="13" font-weight="400" fill="#596775"><tspan x="266" dy="0">Del evento climático a la capacidad de pago, con factores explicables.</tspan></text><text x="266" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="266" dy="0">CajaEscudo · RIE-01     /     Diseño demostrativo; no ejecuta modelos ni decisiones crediticias.</tspan></text><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><text x="1280" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#A51D24"><tspan x="1280" dy="0">Ver metodología</tspan></text></a><rect x="266" y="185" width="716" height="205" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><rect x="286" y="203" width="222" height="27" rx="6" fill="#FFF0EE"/><text x="296" y="221" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#A51D24"><tspan x="296" dy="0">Alta prioridad de revisión</tspan></text><text x="286" y="269" font-family="Manrope, Arial, sans-serif" font-size="25" font-weight="800" fill="#202C39"><tspan x="286" dy="0">Abarrotes El Porvenir</tspan></text><text x="286" y="300" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">Cliente sintético C-0142 · Microempresa · Comercio minorista</tspan></text><text x="286" y="323" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">El Porvenir, La Libertad · Ubicación aproximada y anonimizada</tspan></text><a href="#prevencion" aria-label="Abrir prevencion" style="cursor:pointer"><rect x="286" y="340" width="218" height="42" rx="8" fill="#A51D24"/><text x="302" y="366" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="302" dy="0">Preparar prevención</tspan></text></a><a href="#alertas" aria-label="Abrir alertas" style="cursor:pointer"><rect x="516" y="340" width="190" height="42"