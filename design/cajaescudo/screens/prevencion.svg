<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="Prevenir antes del impacto"><title>Prevenir antes del impacto</title><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F4F7FA"/><rect x="0" y="0" width="230" height="1080" rx="0" fill="#801D2B"/><path d="M43 34 59 41v13c0 9-7 16-16 20-9-4-16-11-16-20V41Z" fill="none" stroke="#FFC200" stroke-width="2.5"/><path d="m35 52 6 6 11-12" fill="none" stroke="#FFC200" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="49" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF"><tspan x="72" dy="0">CajaEscudo</tspan></text><text x="72" y="68" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="72" dy="0">Anticipar para proteger</tspan></text><text x="26" y="116" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF"><tspan x="26" dy="0">Caja Trujillo</tspan></text><path d="M26 138H204" stroke="#A6505C" stroke-width="1"/><a href="#panorama" aria-label="Abrir panorama" style="cursor:pointer"><rect x="16" y="166" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="196" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">01</tspan></text><text x="57" y="189" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Panorama territorial</tspan></text></a><a href="#cliente" aria-label="Abrir cliente" style="cursor:pointer"><rect x="16" y="231" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="261" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">02</tspan></text><text x="57" y="254" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Vulnerabilidad del</tspan><tspan x="57" dy="17.759999999999998">cliente</tspan></text></a><a href="#cartera" aria-label="Abrir cartera" style="cursor:pointer"><rect x="16" y="296" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="326" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">03</tspan></text><text x="57" y="319" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Estrés de cartera</tspan></text></a><a href="#prevencion" aria-label="Abrir prevencion" style="cursor:pointer"><rect x="16" y="361" width="198" height="53" rx="8" fill="#A13B47"/><text x="28" y="391" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFC200"><tspan x="28" dy="0">04</tspan></text><text x="57" y="384" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="57" dy="0">Prevención priorizada</tspan></text></a><a href="#alertas" aria-label="Abrir alertas" style="cursor:pointer"><rect x="16" y="426" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="456" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">05</tspan></text><text x="57" y="449" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Alertas y seguimiento</tspan></text></a><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><rect x="16" y="491" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="521" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">06</tspan></text><text x="57" y="514" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Fuentes y metodología</tspan></text></a><rect x="20" y="720" width="190" height="132" rx="10" fill="#69202D"/><text x="34" y="746" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC200"><tspan x="34" dy="0">RIE-01 · Riesgos</tspan></text><text x="34" y="774" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="34" dy="0">Inclusión financiera y</tspan><tspan x="34" dy="17.759999999999998">resiliencia</tspan></text><text x="34" y="824" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#F6DDE1"><tspan x="34" dy="0">Owner: Miriam</tspan></text><text x="24" y="1008" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">Entorno demostrativo</tspan></text><text x="24" y="1030" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="24" dy="0">Sin datos personales reales</tspan></text><rect x="230" y="0" width="1210" height="76" rx="0" fill="#FFFFFF"/><rect x="230" y="0" width="1210" height="3" rx="0" fill="#FF0901"/><text x="266" y="32" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#596775"><tspan x="266" dy="0">Caja Trujillo / Inteligencia climática y crediticia</tspan></text><text x="266" y="53" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="266" dy="0">Corte ilustrativo: 25 nov 2026 · Acceso interno</tspan></text><rect x="1120" y="23" width="144" height="27" rx="6" fill="#FFF5D6"/><text x="1130" y="41" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="1130" dy="0">Datos sintéticos</tspan></text><text x="1290" y="43" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="1290" dy="0">Miriam · Riesgos</tspan></text><text x="266" y="124" font-family="Manrope, Arial, sans-serif" font-size="29" font-weight="800" fill="#202C39"><tspan x="266" dy="0">Prevenir antes del impacto</tspan></text><text x="266" y="153" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#596775"><tspan x="266" dy="0">Asigna recursos limitados a medidas que sostienen el negocio.</tspan></text><text x="266" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="266" dy="0">CajaEscudo · RIE-01     /     Diseño demostrativo; no ejecuta modelos ni decisiones crediticias.</tspan></text><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><text x="1280" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#A51D24"><tspan x="1280" dy="0">Ver metodología</tspan></text></a><rect x="266" y="184" width="1138" height="190" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="216" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Plan preventivo · escenario severo</tspan></text><rect x="1124" y="202" width="255" height="27" rx="6" fill="#FFF5D6"/><text x="1134" y="220" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="1134" dy="0">Propuesta para revisión</tspan></text><text x="286" y="245" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">Priorizar continuidad operativa con presupuesto y cobertura territorial.</tspan></text><text x="286" y="294" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="286" dy="0">Presupuesto disponible</tspan></text><text x="286" y="337" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="286" dy="0">S/ 48,000</tspan></text><text x="563" y="294" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="563" dy="0">Intervención propuesta</tspan></text><text x="563" y="337" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="563" dy="0">S/ 45,600</tspan></text><text x="840" y="294" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="840" dy="0">Reserva sin asignar</tspan></text><text x="840" y="337" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="840" dy="0">S/ 2,400</tspan></text><text x="1117" y="294" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="1117" dy="0">Clientes únicos cubiertos</tspan></text><text x="1117" y="337" font-family="Manrope, Arial, sans-serif" font-size="27" font-weight="800" fill="#202C39"><tspan x="1117" dy="0">78</tspan></text><rect x="266" y="394" width="1138" height="215" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="421" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="286" dy="0">Intervención</tspan></text><text x="806" y="421" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="806" dy="0">Clientes</tspan></text><text x="956" y="421" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="956" dy="0">Costo estimado</tspan></text><text x="1206" y="421" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="1206" dy="0">Prioridad</tspan></text><path d="M286 438H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="466" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Elevar inventario y proteger mercadería</tspan></text><text x="806" y="466" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="806" dy="0">30</tspan></text><text x="956" y="466" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="956" dy="0">S/ 18,000</tspan></text><text x="1206" y="466" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1206" dy="0">Alta</tspan></text><path d="M286 495H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="523" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Proteger equipos y puntos eléctricos</tspan></text><text x="806" y="523" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="806" dy="0">26</tspan></text><text x="956" y="523" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="956" dy="0">S/ 15,600</tspan></text><text x="1206" y="523" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1206" dy="0">Alta</tspan></text><path d="M286 552H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="580" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Asegurar abastecimiento alternativo</tspan></text><text x="806" y="580" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="806" dy="0">22</tspan></text><text x="956" y="580" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="956" dy="0">S/ 12,000</tspan></text><text x="1206" y="580" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1206" dy="0">Moderada</tspan></text><rect x="266" y="630" width="558" height="272" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="662" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Comparar antes de aprobar</tspan></text><text x="286" y="695" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">Pérdida crediticia de estrés</tspan></text><text x="286" y="738" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" fill="#17634C"><tspan x="286" dy="0">S/ 422 mil → S/ 310 mil</tspan></text><text x="286" y="775" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="286" dy="0">Reducción hipotética: S/ 112 mil</tspan><tspan x="286" dy="17.759999999999998">Costo separado: S/ 45,600 · No es ahorro garantizado.</tspan></text><rect x="286" y="844" width="254" height="27" rx="6" fill="#FFF5D6"/><text x="296" y="862" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="296" dy="0">Efectividad aún no validada</tspan></text><rect x="844" y="630" width="560" height="272" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="864" y="662" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="864" dy="0">No priorizar solo por saldo</tspan></text><text x="864" y="695" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#202C39"><tspan x="864" dy="0">Objetivo: reducir afectación estimada del negocio.</tspan><tspan x="864" dy="25">Restricciones: presupuesto, elegibilidad y ejecución.</tspan><tspan x="864" dy="25">Cobertura: al menos 3 zonas y revisión por segmento.</tspan><tspan x="864" dy="25">Control: no duplicar clientes ni medidas incompatibles.</tspan></text><text x="864" y="832" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="864" dy="0">Salida estática de ejemplo. El optimizador propuesto no se ejecuta en este</tspan><tspan x="864" dy="17.759999999999998">prototipo de diseño.</tspan></text><rect x="266" y="922" width="1138" height="48" rx="8" fill="#EDF4FA"/><text x="280" y="942" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="500" fill="#225A86"><tspan x="280" dy="0">Antes de actuar: validar costos, factibilidad y consentimiento. El plan no cambia contratos ni envía mensajes al cliente.</tspan></text><a href="#alertas" aria-label="Abrir alertas" style="cursor:pointer"><rect x="266" y="990" width="244" height="42" rx="8" fill="#A51D24"/><text x="282" y="1016" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="282" dy="0">Revisar alertas del plan</tspan></text></a><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><rect x="522" y="990" width="226" height="42" rx="8" fill="#FFFFFF" stroke="#DFE5EB"/><text x="538" y="1016" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="538" dy="0">Consultar metodología</tspan></text></a></svg>