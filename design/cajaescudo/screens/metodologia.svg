<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="Fuentes y uso responsable"><title>Fuentes y uso responsable</title><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F4F7FA"/><rect x="0" y="0" width="230" height="1080" rx="0" fill="#801D2B"/><path d="M43 34 59 41v13c0 9-7 16-16 20-9-4-16-11-16-20V41Z" fill="none" stroke="#FFC200" stroke-width="2.5"/><path d="m35 52 6 6 11-12" fill="none" stroke="#FFC200" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="49" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF"><tspan x="72" dy="0">CajaEscudo</tspan></text><text x="72" y="68" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="72" dy="0">Anticipar para proteger</tspan></text><text x="26" y="116" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF"><tspan x="26" dy="0">Caja Trujillo</tspan></text><path d="M26 138H204" stroke="#A6505C" stroke-width="1"/><a href="#panorama" aria-label="Abrir panorama" style="cursor:pointer"><rect x="16" y="166" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="196" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">01</tspan></text><text x="57" y="189" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Panorama territorial</tspan></text></a><a href="#cliente" aria-label="Abrir cliente" style="cursor:pointer"><rect x="16" y="231" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="261" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">02</tspan></text><text x="57" y="254" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Vulnerabilidad del</tspan><tspan x="57" dy="17.759999999999998">cliente</tspan></text></a><a href="#cartera" aria-label="Abrir cartera" style="cursor:pointer"><rect x="16" y="296" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="326" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">03</tspan></text><text x="57" y="319" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Estrés de cartera</tspan></text></a><a href="#prevencion" aria-label="Abrir prevencion" style="cursor:pointer"><rect x="16" y="361" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="391" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">04</tspan></text><text x="57" y="384" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Prevención priorizada</tspan></text></a><a href="#alertas" aria-label="Abrir alertas" style="cursor:pointer"><rect x="16" y="426" width="198" height="53" rx="8" fill="#801D2B"/><text x="28" y="456" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#DCB8BF"><tspan x="28" dy="0">05</tspan></text><text x="57" y="449" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF"><tspan x="57" dy="0">Alertas y seguimiento</tspan></text></a><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><rect x="16" y="491" width="198" height="53" rx="8" fill="#A13B47"/><text x="28" y="521" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFC200"><tspan x="28" dy="0">06</tspan></text><text x="57" y="514" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="57" dy="0">Fuentes y metodología</tspan></text></a><rect x="20" y="720" width="190" height="132" rx="10" fill="#69202D"/><text x="34" y="746" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC200"><tspan x="34" dy="0">RIE-01 · Riesgos</tspan></text><text x="34" y="774" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="34" dy="0">Inclusión financiera y</tspan><tspan x="34" dy="17.759999999999998">resiliencia</tspan></text><text x="34" y="824" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#F6DDE1"><tspan x="34" dy="0">Owner: Miriam</tspan></text><text x="24" y="1008" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">Entorno demostrativo</tspan></text><text x="24" y="1030" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#F6DDE1"><tspan x="24" dy="0">Sin datos personales reales</tspan></text><rect x="230" y="0" width="1210" height="76" rx="0" fill="#FFFFFF"/><rect x="230" y="0" width="1210" height="3" rx="0" fill="#FF0901"/><text x="266" y="32" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#596775"><tspan x="266" dy="0">Caja Trujillo / Inteligencia climática y crediticia</tspan></text><text x="266" y="53" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="266" dy="0">Corte ilustrativo: 25 nov 2026 · Acceso interno</tspan></text><rect x="1120" y="23" width="144" height="27" rx="6" fill="#FFF5D6"/><text x="1130" y="41" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="1130" dy="0">Datos sintéticos</tspan></text><text x="1290" y="43" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="1290" dy="0">Miriam · Riesgos</tspan></text><text x="266" y="124" font-family="Manrope, Arial, sans-serif" font-size="29" font-weight="800" fill="#202C39"><tspan x="266" dy="0">Fuentes y uso responsable</tspan></text><text x="266" y="153" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#596775"><tspan x="266" dy="0">Datos visibles, supuestos explícitos y decisiones bajo revisión humana.</tspan></text><text x="266" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="266" dy="0">CajaEscudo · RIE-01     /     Diseño demostrativo; no ejecuta modelos ni decisiones crediticias.</tspan></text><a href="#metodologia" aria-label="Abrir metodologia" style="cursor:pointer"><text x="1280" y="1054" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#A51D24"><tspan x="1280" dy="0">Ver metodología</tspan></text></a><rect x="266" y="183" width="1138" height="48" rx="8" fill="#FFF5D6"/><text x="280" y="203" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="500" fill="#805600"><tspan x="280" dy="0">Prototipo de navegación: cifras estáticas. No ejecuta modelos predictivos, optimización ni integraciones externas.</tspan></text><rect x="266" y="252" width="1138" height="269" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="279" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="286" dy="0">Insumo</tspan></text><text x="714" y="279" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="714" dy="0">Estado en prototipo</tspan></text><text x="1034" y="279" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#596775"><tspan x="1034" dy="0">Actualización / control</tspan></text><path d="M286 296H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="324" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Cartera y comportamiento de pago</tspan></text><text x="714" y="324" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="714" dy="0">Sintético y anonimizado</tspan></text><text x="1034" y="324" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1034" dy="0">Corte mensual ilustrativo</tspan></text><path d="M286 341H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="369" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Amenaza climática · SENAMHI</tspan></text><text x="714" y="369" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="714" dy="0">Prevista, sin integración</tspan></text><text x="1034" y="369" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1034" dy="0">Vigencia por verificar</tspan></text><path d="M286 386H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="414" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Mapas · CENEPRED / INDECI</tspan></text><text x="714" y="414" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="714" dy="0">Previstos, sin integración</tspan></text><text x="1034" y="414" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1034" dy="0">Escala y licencia por verificar</tspan></text><path d="M286 431H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="459" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Ubicación de negocios</tspan></text><text x="714" y="459" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="714" dy="0">Esquemática y aproximada</tspan></text><text x="1034" y="459" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1034" dy="0">Consentimiento y precisión</tspan></text><path d="M286 476H1384" stroke="#DFE5EB" stroke-width="1"/><text x="286" y="504" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Sobreendeudamiento</tspan></text><text x="714" y="504" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="714" dy="0">Sintético e incompleto</tspan></text><text x="1034" y="504" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#202C39"><tspan x="1034" dy="0">Faltante no equivale a cero</tspan></text><rect x="266" y="544" width="558" height="284" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="576" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Motor analítico propuesto</tspan></text><text x="286" y="609" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#202C39"><tspan x="286" dy="0">1. Cruce geoespacial de amenazas y negocios.</tspan><tspan x="286" dy="26">2. Curvas de daño e interrupción por actividad.</tspan><tspan x="286" dy="26">3. Monte Carlo de ingresos y recuperación.</tspan><tspan x="286" dy="26">4. Estrés crediticio con PD, LGD y EAD.</tspan><tspan x="286" dy="26">5. Optimización preventiva bajo restricciones.</tspan></text><text x="286" y="770" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="286" dy="0">Pendiente: backtesting temporal, calibración, sensibilidad y comparación con</tspan><tspan x="286" dy="16.28">reglas base. Evaluar errores por zona y segmento.</tspan></text><rect x="844" y="544" width="560" height="284" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="864" y="576" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="864" dy="0">La persona conserva la decisión</tspan></text><text x="864" y="609" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#202C39"><tspan x="864" dy="0">Privacidad: acceso por rol, minimización y auditoría.</tspan><tspan x="864" dy="26">Calidad: mostrar faltantes y antigüedad del dato.</tspan><tspan x="864" dy="26">Equidad: revisar falsos positivos por segmento.</tspan><tspan x="864" dy="26">Gobernanza: revisión humana y evidencia.</tspan><tspan x="864" dy="26">Cartera: mínimo mensual; clima según vigencia.</tspan></text><text x="864" y="771" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#A51D24"><tspan x="864" dy="0">Una fuente vencida debe generar una advertencia; nunca sustituirse</tspan><tspan x="864" dy="17.759999999999998">silenciosamente.</tspan></text><rect x="266" y="850" width="1138" height="166" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="882" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Identidad visual verificada</tspan></text><rect x="286" y="901" width="28" height="28" rx="5" fill="#FF0901"/><rect x="324" y="901" width="28" height="28" rx="5" fill="#FFC200"/><text x="370" y="921" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#202C39"><tspan x="370" dy="0">Rojo #FF0901 · Amarillo #FFC200</tspan></text><text x="286" y="951" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="286" dy="0">Fuente: cajatrujillo.com.pe/estilos/cssOutFit.css · Consulta: 25 nov 2026</tspan></text><text x="286" y="976" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="286" dy="0">Manrope mantiene continuidad con Cauce. Borgoña y colores semánticos son extensiones de interfaz, no una paleta oficial declarada.</tspan></text></svg>