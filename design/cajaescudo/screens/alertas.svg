t-weight="700" fill="#A51D24"><tspan x="300" dy="0">A-016</tspan></text><text x="300" y="661" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#202C39"><tspan x="300" dy="0">Transportes Santa Rosa</tspan></text><text x="300" y="687" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#596775"><tspan x="300" dy="0">Moderada · confirmar ruta alterna</tspan></text><text x="286" y="794" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="400" fill="#596775"><tspan x="286" dy="0">Otros casos son referencias visuales.</tspan></text><rect x="696" y="315" width="708" height="514" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><rect x="716" y="336" width="130" height="27" rx="6" fill="#FFF0EE"/><text x="726" y="354" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#A51D24"><tspan x="726" dy="0">Alta prioridad</tspan></text><rect x="858" y="336" width="201" height="27" rx="6" fill="#FFF5D6"/><text x="868" y="354" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#805600"><tspan x="868" dy="0">Pendiente de revisión</tspan></text><text x="716" y="409" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#202C39"><tspan x="716" dy="0">A-018 · Interrupción y presión de pago</tspan></text><text x="716" y="442" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="716" dy="0">Evento simulado: lluvias severas · Horizonte: 30 días</tspan></text><text x="716" y="465" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="716" dy="0">Cliente C-0142 · Analista responsable: Miriam</tspan></text><path d="M716 486H1384" stroke="#DFE5EB" stroke-width="1"/><text x="716" y="518" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#202C39"><tspan x="716" dy="0">Motivo de la alerta</tspan></text><text x="716" y="545" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#202C39"><tspan x="716" dy="0">Reserva de 4 días frente a 5–9 días de cierre. El flujo central bajo estrés cubre 0.83×</tspan><tspan x="716" dy="19.24">las obligaciones mensuales.</tspan></text><text x="716" y="610" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#202C39"><tspan x="716" dy="0">Acción preventiva sugerida</tspan></text><text x="716" y="637" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#202C39"><tspan x="716" dy="0">Verificar mercadería expuesta, acordar elevación del inventario y confirmar</tspan><tspan x="716" dy="19.24">abastecimiento alternativo con el negocio.</tspan></text><rect x="716" y="693" width="668" height="62" rx="8" fill="#EDF4FA"/><text x="730" y="716" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#225A86"><tspan x="730" dy="0">Revisión humana requerida</tspan></text><text x="730" y="739" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="400" fill="#225A86"><tspan x="730" dy="0">Validar → contactar con consentimiento → documentar → dar seguimiento.</tspan></text><a href="#prevencion" aria-label="Abrir prevencion" style="cursor:pointer"><rect x="716" y="772" width="220" height="42" rx="8" fill="#A51D24"/><text x="732" y="798" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="732" dy="0">Ver plan preventivo</tspan></text></a><a href="#cliente" aria-label="Abrir cliente" style="cursor:pointer"><rect x="948" y="772" width="220" height="42" rx="8" fill="#FFFFFF" stroke="#DFE5EB"/><text x="964" y="798" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#202C39"><tspan x="964" dy="0">Ver ficha del cliente</tspan></text></a><rect x="266" y="849" width="1138" height="120" rx="12" fill="#FFFFFF" stroke="#DFE5EB"/><text x="286" y="881" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#202C39"><tspan x="286" dy="0">Trazabilidad del caso</tspan></text><text x="286" y="906" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#596775"><tspan x="286" dy="0">25 nov · 09:10  Generada con escenario sintético CE-0.1</tspan><tspan x="286" dy="17.759999999999998">25 nov · 09:15  Asignada a Miriam · Revisión pendiente</tspan></text><rect x="266" y="990" width="1138" height="48" rx="8" fill="#FFF5D6"/><text x="280" y="1010" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="500" fill="#805600"><tspan x="280" dy="0">No se emiten comunicaciones, aprobaciones, rechazos ni reprogramaciones. Registrar evidencia queda pendiente de implementación.</tspan></text></svg>